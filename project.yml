name: DriveStory
options:
  bundleIdPrefix: com.senatakasawa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  DriveStory:
    type: application
    platform: iOS
    sources:
      - DriveStory
    info:
      path: DriveStory/Info.plist
      properties:
        CFBundleDisplayName: Drive Story
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 走行中のルートを記録して、ドライブの共有画像を作るために使います。
        NSPhotoLibraryUsageDescription: ドライブ中に撮影した写真を自動で選び、共有画像に配置するために使います。
        NSPhotoLibraryAddUsageDescription: 作成したドライブの1枚を、写真ライブラリへ保存するために使います。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senatakasawa.drivestory
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
